name: Publish CLI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA approved for release
        required: true
        type: string

permissions:
  actions: write
  contents: write

jobs:
  detect-release:
    name: Detect CLI release changes
    runs-on: ubuntu-latest
    env:
      RELEASE_COMMIT: ${{ inputs.commit_sha || github.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    outputs:
      should_publish: ${{ steps.changes.outputs.should_publish }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect changes since the latest release
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_SHA" != "$RELEASE_COMMIT" ]]; then
              echo "The workflow ref does not match the release commit."
              exit 1
            fi
            default_branch_sha="$(git ls-remote origin "refs/heads/${DEFAULT_BRANCH}" | cut -f1)"
            if [[ "$default_branch_sha" != "$RELEASE_COMMIT" ]]; then
              echo "The approved release commit is not the current ${DEFAULT_BRANCH} tip."
              exit 1
            fi
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_error="$(mktemp)"
          if latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>"$release_error")"; then
            rm -f "$release_error"
          else
            status="$?"
            if grep -q "HTTP 404" "$release_error"; then
              rm -f "$release_error"
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$release_error" >&2
            rm -f "$release_error"
            exit "$status"
          fi

          release_commit="$(gh release view "$latest_tag" --json targetCommitish --jq '.targetCommitish')"
          affected="$(
            TURBO_SCM_BASE="$release_commit" \
            TURBO_SCM_HEAD="$GITHUB_SHA" \
            bunx --bun turbo ls --affected --output=json
          )"
          if jq -e '.packages.items | any(.name == "chofex-cli")' <<<"$affected" >/dev/null; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish chofex-cli
    needs: detect-release
    if: needs.detect-release.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.verify-target.outputs.stale == 'true' || steps.verify-current.outputs.stale == 'true' }}
    concurrency:
      group: publish-cli
      cancel-in-progress: false
    env:
      RELEASE_VERSION: 0.1.${{ github.run_number }}
      RELEASE_COMMIT: ${{ inputs.commit_sha || github.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify release target
        id: verify-target
        run: |
          echo "stale=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_SHA" != "$RELEASE_COMMIT" ]]; then
            echo "The workflow ref does not match the release commit."
            exit 1
          fi
          default_branch_sha="$(git ls-remote origin "refs/heads/${DEFAULT_BRANCH}" | cut -f1)"
          if [[ "$default_branch_sha" != "$RELEASE_COMMIT" ]]; then
            echo "The approved release commit is not the current ${DEFAULT_BRANCH} tip."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop stale release
        if: steps.verify-target.outputs.stale == 'true'
        run: exit 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up npm authentication
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test CLI
        run: bun --filter chofex-cli test

      - name: Check CLI types
        run: bun --filter chofex-cli check-types

      - name: Set release version
        run: |
          node -e 'const fs = require("node:fs"); const path = "apps/cli/package.json"; const pkg = JSON.parse(fs.readFileSync(path, "utf8")); pkg.version = process.env.RELEASE_VERSION; fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);'

      - name: Build CLI
        run: bun --filter chofex-cli build

      - name: Smoke test executable
        run: test "$(node apps/cli/dist/index.js --version)" = "chofex v${RELEASE_VERSION}"

      - name: Publish to npm
        working-directory: apps/cli
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
        run: bun publish --access public --tag history --tolerate-republish

      - name: Verify release is still current
        id: verify-current
        run: |
          echo "stale=false" >> "$GITHUB_OUTPUT"
          default_branch_sha="$(git ls-remote origin "refs/heads/${DEFAULT_BRANCH}" | cut -f1)"
          if [[ "$default_branch_sha" != "$RELEASE_COMMIT" ]]; then
            echo "A newer ${DEFAULT_BRANCH} commit exists; leaving this version on the history tag."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop stale release
        if: steps.verify-current.outputs.stale == 'true'
        run: exit 1

      - name: Promote current release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          NPM_CONFIG_FORCE: "true"
        run: npm dist-tag add "chofex-cli@${RELEASE_VERSION}" latest

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="v${RELEASE_VERSION}"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "GitHub release ${release_tag} already exists."
            exit 0
          fi
          gh release create "$release_tag" \
            --target "$GITHUB_SHA" \
            --title "chofex-cli ${release_tag}" \
            --notes "Install this release with \`npm install --global chofex-cli@${RELEASE_VERSION}\`." \
            --generate-notes \
            --latest

  recover-current-release:
    name: Requeue current CLI release
    needs: publish
    if: always() && needs.publish.outputs.stale == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Dispatch the current default-branch tip
        run: |
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${DEFAULT_BRANCH}" --jq '.commit.sha')"
          gh workflow run publish-cli.yml \
            --ref "$DEFAULT_BRANCH" \
            -f commit_sha="$latest_sha"

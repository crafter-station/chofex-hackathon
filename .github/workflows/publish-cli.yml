name: Publish CLI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    name: Publish chofex-cli
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: 0.1.${{ github.run_number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test CLI
        run: bun --filter chofex-cli test

      - name: Check CLI types
        run: bun --filter chofex-cli check-types

      - name: Set release version
        run: |
          node -e 'const fs = require("node:fs"); const path = "apps/cli/package.json"; const pkg = JSON.parse(fs.readFileSync(path, "utf8")); pkg.version = process.env.RELEASE_VERSION; fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);'

      - name: Build CLI
        run: bun --filter chofex-cli build

      - name: Smoke test executable
        run: test "$(node apps/cli/dist/index.js --version)" = "chofex v${RELEASE_VERSION}"

      - name: Publish to npm
        working-directory: apps/cli
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
        run: bun publish --access public --tag history --tolerate-republish

      - name: Promote current main release
        env:
          NPM_CONFIG_FORCE: "true"
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
        run: |
          latest_main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$latest_main_sha" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit exists; leaving this version on the history tag."
            exit 0
          fi
          npm dist-tag add "chofex-cli@${RELEASE_VERSION}" latest
